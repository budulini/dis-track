services:
  bot:
    build: .
    command: ["node", "dist/API.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      API_PORT: "3000"
    expose:
      - "3000"
    networks:
      proxy-public:
        aliases:
          - dis-track
    volumes:
      - type: bind
        source: ./spotify-data
        target: /app/spotify-data
        bind:
          create_host_path: false

      - type: bind
        source: ./cookies.json
        target: /app/cookies.json
        read_only: true
        bind:
          create_host_path: false

networks:
  proxy-public:
    external: true
